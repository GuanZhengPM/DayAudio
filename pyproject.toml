[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dayaudio"
version = "0.2.0"
description = "Local, resumable, speaker-aware long-audio transcription and evidence-linked summaries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DayAudio contributors" }]
keywords = ["asr", "audio", "transcription", "diarization", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
fast = ["funasr>=1.2", "numpy>=1.26", "torch>=2.2"]
speaker = ["funasr>=1.2", "numpy>=1.26", "torch>=2.2", "scikit-learn>=1.4"]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.12"]

[project.scripts]
dayaudio = "dayaudio.cli:main"

[project.urls]
Documentation = "https://github.com/GuanZhengPM/DayAudio"
Repository = "https://github.com/GuanZhengPM/DayAudio"
Issues = "https://github.com/GuanZhengPM/DayAudio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
